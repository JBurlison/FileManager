<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebFileExplorer.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="WebFileExplorer.Client.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/standard-dark.css">
    <script type="importmap"></script>
</head>

<body class="dark-mode">
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor#[.{fingerprint}].js"></script>
    <script>
        window.focusFileExplorerElement = (elementId) => {
            const element = document.getElementById(elementId);
            if (!element) {
                return;
            }

            element.focus({ preventScroll: true });
            if (typeof element.select === 'function') {
                element.select();
            }
        };

        window.registerKeyboardInterceptor = (elementId) => {
            const element = document.getElementById(elementId);
            if (!element) {
                return;
            }

            window.fileExplorerKeyboardInterceptors ??= {};
            const existingInterceptor = window.fileExplorerKeyboardInterceptors[elementId];
            if (existingInterceptor) {
                document.removeEventListener('keydown', existingInterceptor, true);
            }

            const isElement = (target) => target instanceof Element;
            const isEditableTarget = (target) => isElement(target) &&
                (target.closest('input, textarea, select, [contenteditable="true"]') || target.isContentEditable);
            const isInteractiveTarget = (target) => isElement(target) &&
                target.closest('button, a[href], [role="button"], .rz-button');
            const isDialogTarget = (target) => isElement(target) &&
                target.closest('.rz-dialog, .rz-dialog-wrapper, .rz-context-menu, [role="dialog"]');
            const hasOpenOverlay = () => document.querySelector('.rz-dialog, .rz-dialog-wrapper, .rz-context-menu, [role="dialog"]') !== null;

            const shouldHandleKey = (event) => {
                const key = event.key.toLowerCase();
                const isPrintable = event.key.length === 1 && !event.ctrlKey && !event.altKey && !event.metaKey;
                const isNavigationKey = key === 'arrowup' || key === 'arrowdown' || key === 'arrowleft' || key === 'arrowright' ||
                    key === 'home' || key === 'end' || key === 'pageup' || key === 'pagedown';
                const isCtrlShortcut = event.ctrlKey && (key === 'a' || key === 'c' || key === 'd' || key === 'e' ||
                    key === 'f' || key === 'l' || key === 'x' || key === 'v');
                const isAltShortcut = event.altKey && (key === 'arrowleft' || key === 'arrowright' || key === 'arrowup' ||
                    key === 'd' || key === 'enter');

                return isPrintable || isNavigationKey || isCtrlShortcut || isAltShortcut ||
                    (event.ctrlKey && event.shiftKey && key === 'n') ||
                    (event.shiftKey && key === 'f10') ||
                    key === 'f2' || key === 'f3' || key === 'f5' || key === 'delete' || key === 'backspace' ||
                    key === 'enter' || key === 'escape' || key === 'contextmenu';
            };

            const createForwardedEvent = (event) => {
                const forwardedEvent = new KeyboardEvent('keydown', {
                    key: event.key,
                    code: event.code,
                    location: event.location,
                    ctrlKey: event.ctrlKey,
                    shiftKey: event.shiftKey,
                    altKey: event.altKey,
                    metaKey: event.metaKey,
                    repeat: event.repeat,
                    bubbles: true,
                    cancelable: true
                });
                Object.defineProperty(forwardedEvent, 'fileExplorerForwarded', { value: true });
                return forwardedEvent;
            };

            const interceptor = (event) => {
                if (!document.body.contains(element)) {
                    document.removeEventListener('keydown', interceptor, true);
                    delete window.fileExplorerKeyboardInterceptors[elementId];
                    return;
                }

                if (event.fileExplorerForwarded || !shouldHandleKey(event)) {
                    return;
                }

                if (isEditableTarget(event.target) || isDialogTarget(event.target)) {
                    return;
                }

                if (hasOpenOverlay()) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }

                const eventStartedInsideFileView = element.contains(event.target);
                if (!eventStartedInsideFileView && isInteractiveTarget(event.target)) {
                    return;
                }

                // Stop the original event from being handled by inner widgets (e.g., Radzen DataGrid)
                // which would otherwise swallow keys like ArrowUp/Down or Ctrl+A before they
                // can bubble up to the file-container's Blazor @onkeydown handler.
                event.preventDefault();
                event.stopPropagation();
                if (typeof event.stopImmediatePropagation === 'function') {
                    event.stopImmediatePropagation();
                }

                if (!eventStartedInsideFileView) {
                    element.focus({ preventScroll: true });
                }

                // Dispatch a forwarded copy directly to the file-container so Blazor's
                // @onkeydown="OnKeyDown" fires reliably regardless of which descendant
                // had focus when the user pressed the key.
                element.dispatchEvent(createForwardedEvent(event));
            };

            window.fileExplorerKeyboardInterceptors[elementId] = interceptor;
            document.addEventListener('keydown', interceptor, true);
        };
    </script>
</body>

</html>
